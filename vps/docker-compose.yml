version: "3.8"

# ─────────────────────────────────────────────────────────────
# futbin-scrap-mob
# Serviços:
#   api           → nginx: JSON público + proxy para scraper-api e puppeteer
#   scraper-api   → HTTP que dispara o scraper e reporta status
#   puppeteer-svc → renderiza cards HTML em PNG via Chromium headless
#   scraper       → roda sob demanda (docker compose run scraper ...)
# ─────────────────────────────────────────────────────────────

networks:
  web:
    external: true

services:

  # ── API pública — nginx ────────────────────────────────────
  api:
    image: nginx:alpine
    container_name: futbin-mob-api
    restart: unless-stopped
    networks:
      - web
    volumes:
      - /opt/scraper-mobile-geral/dispatcher/data:/usr/share/nginx/html/data:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.futbin-mob.rule=Host(`mobalfutbin.chamacoins.com.br`)"
      - "traefik.http.routers.futbin-mob.entrypoints=websecure"
      - "traefik.http.routers.futbin-mob.tls.certresolver=lehttp"
      - "traefik.http.services.futbin-mob.loadbalancer.server.port=80"

  # ── Scraper API ────────────────────────────────────────────
  scraper-api:
    build: ./scraper-api
    container_name: futbin-scraper-api
    restart: unless-stopped
    networks:
      - web
    volumes:
      - /opt/scraper-mobile-geral/dispatcher/data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/scraper-mobile-geral/futbin-scraper:/compose:ro

  # ── Puppeteer PNG renderer ─────────────────────────────────
  puppeteer-svc:
    build: ./puppeteer-svc
    container_name: futbin-puppeteer
    restart: unless-stopped
    networks:
      - web
    environment:
      PORT: "3000"
      FC_TOKEN: "${FC_TOKEN:-}"   # defina em .env ou exporte na shell
      CONCURRENCY: "3"
    shm_size: "256mb"             # evita crash do Chromium por /dev/shm pequeno

  # ── Scraper — sob demanda ──────────────────────────────────
  scraper:
    build: .
    container_name: futbin-mob-scraper
    network_mode: host
    volumes:
      - /opt/scraper-mobile-geral/dispatcher/data:/data
