server {
    listen 80;

    add_header Access-Control-Allow-Origin  "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, X-FC-Token" always;

    # GET /players → result.json (backward compat)
    location = /players {
        alias /usr/share/nginx/html/data/result.json;
        default_type application/json;
    }

    # GET /squads → squads_index.json
    location = /squads {
        alias /usr/share/nginx/html/data/squads_index.json;
        default_type application/json;
    }

    # GET /squad/{label} → result_{label}.json
    location ~ ^/squad/([a-zA-Z0-9_-]+)$ {
        root /usr/share/nginx/html;
        try_files /data/result_$1.json @squad_not_found;
        default_type application/json;
    }

    location @squad_not_found {
        return 404 '{"error":"squad not found"}';
        default_type application/json;
    }

    # POST /run-scrape → scraper-api
    location = /run-scrape {
        proxy_pass         http://futbin-scraper-api:8001/run-scrape;
        proxy_read_timeout 10s;
        proxy_set_header   Host $host;
    }

    # GET /status/{label} → scraper-api
    location ~ ^/status/([a-zA-Z0-9_-]+)$ {
        proxy_pass       http://futbin-scraper-api:8001/status/$1;
        proxy_read_timeout 5s;
        proxy_set_header Host $host;
    }

    # POST /refresh-squads → scraper-api (síncrono, aguarda até 90s)
    location = /refresh-squads {
        proxy_pass         http://futbin-scraper-api:8001/refresh-squads;
        proxy_read_timeout 90s;
        proxy_send_timeout 10s;
        proxy_set_header   Host $host;
    }

    # POST /render-batch → puppeteer-svc
    location = /render-batch {
        proxy_pass         http://futbin-puppeteer:3000/render-batch;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 5m;
        proxy_set_header   Host $host;
        proxy_set_header   X-FC-Token $http_x_fc_token;
    }

    # GET /health
    location = /health {
        return 200 '{"status":"ok"}';
        default_type application/json;
    }

    location / {
        return 404 '{"error":"not found"}';
        default_type application/json;
    }
}
